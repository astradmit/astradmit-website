# Deploys the site to the LIVE address whenever a pull request is merged into main.
# The Firebase CLI wizard (firebase init hosting:github) will fill in the secret name
# and project ID for you. If it asks to overwrite this file, answer yes.
name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YOUR_PROJECT_ID }}
          channelId: live
          projectId: your-firebase-project-id
